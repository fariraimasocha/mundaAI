<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="favLeafLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B14E" />
      <stop offset="100%" stop-color="#BA8529" />
    </linearGradient>
    <linearGradient id="favLeafRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8BE65" />
      <stop offset="100%" stop-color="#C79435" />
    </linearGradient>
  </defs>

  <!-- Dark rounded squircle container -->
  <rect x="16" y="16" width="480" height="480" rx="120" ry="120" fill="#1C1F24" />

  <!-- The unified stylized letter M -->
  <path
    d="M 92 120 L 152 120 L 256 320 L 360 120 L 420 120 L 420 392 L 362 392 L 362 214 L 272 384 L 240 384 L 150 214 L 150 392 L 92 392 Z"
    fill="#FFFFFF"
  />

  <!-- Golden Leaf nestled within the central V opening -->
  <g>
    <!-- Left Leaf Lobe -->
    <path
      d="M 256 160 C 220 205 212 280 255.5 348 L 255.5 160 Z"
      fill="url(#favLeafLeft)"
    />
    <!-- Right Leaf Lobe -->
    <path
      d="M 256 160 C 292 205 300 280 256.5 348 L 256.5 160 Z"
      fill="url(#favLeafRight)"
    />
    <!-- Center Midrib / Stem -->
    <line x1="256" y1="165" x2="256" y2="345" stroke="#1C1F24" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
